name: Build and Release BerryBot

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Prepare Release Artifacts
        id: prep
        run: |
          mkdir -p release_dist
          cp app/build/outputs/apk/debug/app-debug.apk release_dist/berrybot-debug.apk
          
          # Extract version from app/build.gradle
          VERSION_CODE=$(grep 'versionCode' app/build.gradle | head -n1 | awk '{print $2}')
          VERSION_NAME=$(grep 'versionName' app/build.gradle | head -n1 | tr -d '"' | awk '{print $2}')
          
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          
          # Generate version.json manifest for in-app OTA updates
          cat <<EOF > release_dist/version.json
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/v$VERSION_NAME/berrybot-debug.apk",
            "downloadUrl": "https://github.com/${{ github.repository }}/releases/download/v$VERSION_NAME/berrybot-debug.apk",
            "changelog": "Automated CI/CD build for BerryBot v$VERSION_NAME ($GITHUB_SHA)"
          }
          EOF
          
          cat release_dist/version.json

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: berrybot-v${{ steps.prep.outputs.version_name }}-debug
          path: release_dist/*

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v${{ steps.prep.outputs.version_name }}
          name: "BerryBot v${{ steps.prep.outputs.version_name }}"
          body: |
            ## BerryBot v${{ steps.prep.outputs.version_name }} (Build ${{ steps.prep.outputs.version_code }})
            
            Optimized SSH client for BlackBerry Classic (Android 4.3 / API 18 Dalvik) connecting to remote Antigravity CLI tmux session.
            
            ### Included Assets:
            - **berrybot-debug.apk**: Ready to install directly on BlackBerry 10.
            - **version.json**: OTA update manifest for in-app auto-updates.
            
            ### Changes:
            - Built automatically from commit ${{ github.sha }}.
          draft: false
          prerelease: false
          files: |
            release_dist/berrybot-debug.apk
            release_dist/version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
