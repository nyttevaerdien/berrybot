name: Build and Release BerryBot

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-33 build-tools;33.0.2'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Prepare Release Artifacts
        id: prep
        run: |
          mkdir -p release_dist
          
          # Extract version from app/build.gradle safely
          VERSION_CODE=$(grep -E '^\s*versionCode' app/build.gradle | head -n1 | awk '{print $2}' | tr -d '\r\n[:space:]')
          VERSION_NAME=$(grep -E '^\s*versionName' app/build.gradle | head -n1 | sed -E 's/.*"([^"]+)".*/\1/' | tr -d '\r\n[:space:]')
          
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          
          # Produce cleanly named APK artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "release_dist/berrybot-${VERSION_NAME}.apk"
          cp "release_dist/berrybot-${VERSION_NAME}.apk" "release_dist/berrybot.${VERSION_NAME}.apk"
          cp "release_dist/berrybot-${VERSION_NAME}.apk" release_dist/berrybot.apk
          cp "release_dist/berrybot-${VERSION_NAME}.apk" release_dist/berrybot-debug.apk
          
          # Generate version.json manifest for in-app OTA updates (using jsDelivr CDN for Android 4.3 cipher compatibility)
          cat <<EOF > release_dist/version.json
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "apkUrl": "https://cdn.jsdelivr.net/gh/${{ github.repository }}@release-apk/berrybot.apk",
            "downloadUrl": "https://cdn.jsdelivr.net/gh/${{ github.repository }}@release-apk/berrybot.apk",
            "fallbackUrl": "https://github.com/${{ github.repository }}/releases/download/v$VERSION_NAME/berrybot-$VERSION_NAME.apk",
            "changelog": "Automated CI/CD build for BerryBot v$VERSION_NAME (${GITHUB_SHA:0:7})"
          }
          EOF
          
          cat release_dist/version.json

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: berrybot-${{ steps.prep.outputs.version_name }}
          path: |
            release_dist/berrybot-${{ steps.prep.outputs.version_name }}.apk
            release_dist/berrybot.${{ steps.prep.outputs.version_name }}.apk
            release_dist/berrybot.apk
            release_dist/berrybot-debug.apk
            release_dist/version.json

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ steps.prep.outputs.version_name }}
          name: "BerryBot v${{ steps.prep.outputs.version_name }}"
          body: |
            ## BerryBot v${{ steps.prep.outputs.version_name }} (Build ${{ steps.prep.outputs.version_code }})
            
            Optimized SSH client for BlackBerry Classic (Android 4.3 / API 18 Dalvik) connecting to remote Antigravity CLI tmux session.
            
            ### Included Assets:
            - **berrybot-${{ steps.prep.outputs.version_name }}.apk**: Release package for BlackBerry 10 / Android 4.3.
            - **version.json**: OTA update manifest for in-app auto-updates.
            
            ### Changes:
            - Built automatically from commit ${{ github.sha }}.
          draft: false
          prerelease: false
          files: |
            release_dist/berrybot-${{ steps.prep.outputs.version_name }}.apk
            release_dist/berrybot.${{ steps.prep.outputs.version_name }}.apk
            release_dist/berrybot.apk
            release_dist/berrybot-debug.apk
            release_dist/version.json
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to CDN Branch (release-apk)
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git fetch origin release-apk:release-apk 2>/dev/null || true
          git checkout -B release-apk
          git rm -rf . >/dev/null 2>&1 || true
          cp release_dist/berrybot.apk ./berrybot.apk
          cp release_dist/berrybot-${{ steps.prep.outputs.version_name }}.apk ./berrybot-${{ steps.prep.outputs.version_name }}.apk
          cp release_dist/version.json ./version.json
          git add berrybot.apk "berrybot-${{ steps.prep.outputs.version_name }}.apk" version.json
          git commit -m "Deploy BerryBot v${{ steps.prep.outputs.version_name }} to CDN branch [skip ci]" || true
          git push origin release-apk --force
